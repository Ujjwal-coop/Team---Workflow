{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Signup | TeamFlow</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container vh-100 d-flex justify-content-center align-items-center">
<div class="card p-4" style="width:380px">

<h4 class="text-center">Create Account</h4>

<form method="post">
{% csrf_token %}

<input type="hidden" name="role" id="role">

<button type="button" class="btn btn-outline-primary w-100 mb-2"
onclick="setRole('employee')">Employee</button>

<button type="button" class="btn btn-outline-secondary w-100 mb-3"
onclick="setRole('manager')">Manager</button>

<input name="username" class="form-control mb-2" placeholder="Username" required>
<input name="password" type="password" class="form-control mb-2" placeholder="Password" required>

<div id="managerBox">
<select name="manager" class="form-select mb-2">
<option value="">Select Manager</option>
{% for m in managers %}
<option value="{{ m.id }}">{{ m.company_name }} — {{ m.user.username }}</option>
{% endfor %}
</select>
</div>

<button class="btn btn-success w-100">Sign Up</button>
</form>
</div>
</div>

<script>
function setRole(r){
document.getElementById("role").value = r;
document.getElementById("managerBox").style.display = r === "employee" ? "block" : "none";
}
setRole("employee");
</script>

</body>
</html>
