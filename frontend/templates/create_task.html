{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Create Task — Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand fw-bold">Create Task — Manager</span>
    <a href="{% url 'manager_dashboard' %}" class="btn btn-outline-light btn-sm">
        Back to Dashboard
    </a>
</nav>

<div class="container d-flex justify-content-center mt-5">
    <div class="card shadow-sm p-4" style="width: 450px;">
        <h4 class="text-center mb-4">Assign Task to Employee</h4>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Task Title</label>
                {{ form.title }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Task Description / Message
                </label>
                {{ form.description }}
            </div>

            <div class="mb-3">
                <label class="form-label">Assign to Employee</label>
                {{ form.employee }}
                <small class="text-muted">
                    Only employees under you are shown
                </small>
            </div>

            <div class="mb-4">
                <label class="form-label">Deadline</label>
                {{ form.deadline }}
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Create Task
            </button>
        </form>
    </div>
</div>

</body>
</html>
