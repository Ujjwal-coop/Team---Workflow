{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Tasks | TeamFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand">TeamFlow</span>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm">Back</a>
    </div>
</nav>

<div class="container mt-4">
    <h5 class="mb-3">My Tasks</h5>

    {% for task in tasks %}
    <div class="card shadow-sm mb-2">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h6>{{ task.title }}</h6>
                <small class="text-muted">Deadline: {{ task.deadline }}</small><br>
                <span class="badge bg-secondary">{{ task.status }}</span>
            </div>
            <a href="{% url 'task_update' task.id %}" class="btn btn-sm btn-primary">
                Update
            </a>
        </div>
    </div>
    {% empty %}
        <p class="text-muted">No tasks assigned.</p>
    {% endfor %}
</div>

</body>
</html>
