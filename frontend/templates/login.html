<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | TeamFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-sm p-4" style="width: 360px;">

        <h4 class="text-center mb-1">TeamFlow</h4>
        <p class="text-center text-muted mb-3">
            Multi-Company Task Management System
        </p>

        <!-- ROLE TABS -->
        <div class="d-flex justify-content-center mb-3">
            <button class="btn btn-outline-primary btn-sm me-2" id="employeeTab">
                Employee
            </button>
            <button class="btn btn-outline-secondary btn-sm" id="managerTab">
                Manager
            </button>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-1 text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <!-- MANAGER SELECT (EMPLOYEE ONLY) -->
            <div class="mb-3" id="managerSelect">
                <label class="form-label">
                    Select Manager <small class="text-muted">(Employees only)</small>
                </label>
                <select name="manager" class="form-select">
                    <option value="">-- Select Manager --</option>
                    {% for manager in managers %}
                        <option value="{{ manager.id }}">
                            {{ manager.user.username }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <button class="btn btn-primary w-100" type="submit">
                Login
            </button>
        </form>

        <!-- SIGNUP LINK -->
        <div class="text-center mt-3">
            <a href="#" class="text-decoration-none">
                Don’t have an account? <strong>Sign up</strong>
            </a>
        </div>

        <p class="text-center text-muted mt-2" style="font-size: 12px;">
            Admin · Manager · Employee access only
        </p>
    </div>
</div>

<script>
    const employeeTab = document.getElementById("employeeTab");
    const managerTab = document.getElementById("managerTab");
    const managerSelect = document.getElementById("managerSelect");

    employeeTab.onclick = () => {
        managerSelect.style.display = "block";
    };

    managerTab.onclick = () => {
        managerSelect.style.display = "none";
    };
</script>

</body>
</html>
