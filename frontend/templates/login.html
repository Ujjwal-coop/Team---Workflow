{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | TeamFlow</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
<div class="card p-4 shadow" style="width: 360px;">

<h4 class="text-center mb-1">TeamFlow</h4>
<p class="text-center text-muted mb-3">Multi-Company Task Management System</p>

<!-- ROLE TABS -->
<div class="d-flex justify-content-center mb-3">
    <button type="button" id="empBtn" class="btn btn-outline-primary btn-sm me-2 active"
        onclick="selectRole('employee')">Employee</button>

    <button type="button" id="mgrBtn" class="btn btn-outline-secondary btn-sm"
        onclick="selectRole('manager')">Manager</button>
</div>

<form method="post">
{% csrf_token %}

<!-- 🔑 HIDDEN ROLE (CRITICAL FIX) -->
<input type="hidden" name="role" id="roleInput" value="employee">

<input class="form-control mb-2" name="username" placeholder="Username" required>
<input type="password" class="form-control mb-3" name="password" placeholder="Password" required>

<!-- MANAGER SELECT -->
<div id="managerBox">
<label class="form-label">Select Manager (Employees only)</label>
<select name="manager" class="form-select mb-3">
    <option value="">-- Select Manager --</option>
    {% for m in managers %}
    <option value="{{ m.id }}">
        {{ m.company_name }} — {{ m.user.username }}
    </option>
    {% endfor %}
</select>
</div>

<button class="btn btn-primary w-100">Login</button>

<p class="text-center mt-2">
<a href="{% url 'signup' %}">Don't have an account? Sign up</a>
</p>

<p class="text-center text-muted small">
Admin · Manager · Employee access only
</p>

</form>
</div>
</div>

<script>
function selectRole(role) {
    document.getElementById("roleInput").value = role;

    document.getElementById("empBtn").classList.remove("active");
    document.getElementById("mgrBtn").classList.remove("active");

    if (role === "employee") {
        document.getElementById("empBtn").classList.add("active");
        document.getElementById("managerBox").style.display = "block";
    } else {
        document.getElementById("mgrBtn").classList.add("active");
        document.getElementById("managerBox").style.display = "none";
    }
}
</script>

</body>
</html>
