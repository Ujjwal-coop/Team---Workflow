{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | TeamFlow</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">Admin Dashboard</span>
        <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-4">

    <!-- SUMMARY CARDS -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h6>Total Users</h6>
                    <h4>{{ users }}</h4>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h6>Managers</h6>
                    <h4>{{ managers }}</h4>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h6>Employees</h6>
                    <h4>{{ employees }}</h4>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h6>Tasks</h6>
                    <h4>{{ tasks }}</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- QUICK ADMIN ACTIONS -->
    <h5 class="mb-3">Quick Admin Actions</h5>

    <div class="d-flex flex-wrap gap-2">

        <!-- Django Admin: Users -->
        <a href="/admin/auth/user/"
           class="btn btn-primary">
            Manage Users
        </a>

        <!-- Django Admin: Managers -->
        <a href="/admin/core/managerprofile/"
           class="btn btn-secondary">
            Manage Managers
        </a>

        <!-- Django Admin: Employees -->
        <a href="/admin/core/employeeprofile/"
           class="btn btn-success">
            Manage Employees
        </a>

        <!-- Django Admin: Tasks -->
        <a href="/admin/core/task/"
           class="btn btn-warning">
            Manage Tasks
        </a>

    </div>

</div>

</body>
</html>
