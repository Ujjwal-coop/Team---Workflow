{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard | TeamFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand">Admin Dashboard</span>
    <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
  </div>
</nav>

<div class="container mt-4">

<div class="row g-3 mb-4">
  <div class="col-md-3">
    <div class="card text-center">
      <div class="card-body">
        <h6>Total Users</h6>
        <h4>{{ users }}</h4>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card text-center">
      <div class="card-body">
        <h6>Managers</h6>
        <h4>{{ managers }}</h4>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card text-center">
      <div class="card-body">
        <h6>Employees</h6>
        <h4>{{ employees }}</h4>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card text-center">
      <div class="card-body">
        <h6>Tasks</h6>
        <h4>{{ tasks }}</h4>
      </div>
    </div>
  </div>
</div>

<h5>Quick Admin Actions</h5>

<a href="{% url 'admin_user_list' %}" class="btn btn-primary me-2">Manage Users</a>
<a href="{% url 'admin_manager_list' %}" class="btn btn-secondary me-2">Manage Managers</a>
<a href="{% url 'admin_employee_list' %}" class="btn btn-success">Manage Employees</a>

</div>

</body>
</html>
